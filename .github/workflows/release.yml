name: Release installer

# Creating a tag like v1.0.0 builds the Windows installer and publishes it on the Releases page.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v1.0.1); created if it does not exist
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Optional: set the repository variable KERIO_DEFAULT_HOST (Settings -> Secrets and variables ->
      # Actions -> Variables) to bake the mail server into the package so users are not asked for it.
      # Do this only in a private repository: the release package is public in a public repository.
      - name: Build installer
        run: installer/build.sh "${{ vars.KERIO_DEFAULT_HOST }}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/kerio-mcp-installer.zip --clobber
          else
            gh release create "$TAG" dist/kerio-mcp-installer.zip --title "$TAG" --generate-notes
          fi
